# Pytest configuration. Before 3.2 there was none, which meant "run what is safe on this machine"
# was not expressible: the suite was all-or-nothing and the standing rule was to run it only on the
# GPU box.
#
# That rule rested on a wrong reason. Measured on the Windows dev box (docs/v3_2_progress.md,
# standing rule 2): TensorFlow 2.20 imports in 6.6 s, list_physical_devices('GPU') is empty, and all
# 891 tests collect in 10.7 s. The constraint is NO GPU, not "no TensorFlow" -- Keras graph
# construction, get_config/from_config round-trips, load_weights shape refusals, the layer-name
# contract and the one-epoch tiny trains are all CPU work.
#
# So the default invocation is the local tier, and the GPU box runs everything:
#
#     python -m pytest -q          # local tier: everything that does not need CUDA
#     python -m pytest -q -m ""    # every tier, on WSL
#
# A CLI -m overrides the one in addopts (command-line args are appended after addopts, and -m takes
# a single value), which is what makes -m "" mean "no deselection" rather than "and also empty".
[pytest]
testpaths = tests
addopts = -m "not gpu" --strict-markers
markers =
    gpu: needs a visible CUDA device -- a real train, a batched rollout at scale, or mixed_float16
         loss-scaling behaviour. Deselected by default; run with -m "" on the GPU box.
    slow: over roughly 60 s locally. Measured, not guessed -- see docs/v3_2_progress.md. Still in
          the default tier, because a slow test that runs is worth more than a fast one that does
          not.
